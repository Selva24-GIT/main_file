{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/content.css' %}">
    <title>Document</title>
</head>

<body>



    <nav>

        </h1>
    </nav>

        <h1 class="subtitle">BREAKING NEWS</h1>
    </header>

    <aside>

            {{key.article_subtitle}}

        <p class="contentpara">

              <P class="contentend">

    <main>

        </p>
    </main>
    <footer>
            <a href="{% url 'product' key.id %}"> BACK TO HOME PAGE</a>

    </footer>

</html>
