{% extends "main.html" %}
{% load static %}
{% block css %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
    <link href="https://googleapis.com" rel="stylesheet">
    {% endblock %}
    <title>Document</title>

</head>

<body>
     
    {% block content %}

    
    {% include "header.html" %}
    
    <main>
        <img src="{% static key.article_img %}" alt="404">
    </main>
    <aside class="content_block">
        <p>
            {{key.content | truncatewords:95}}
            <a href="{% url 'demo' key.id %}">read more</a>
        </p>
    </aside>



    {% endblock %}

</body>

</html>
