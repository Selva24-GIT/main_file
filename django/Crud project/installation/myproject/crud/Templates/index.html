<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>crud app</h1>
    <table border="1" cellpadding="10" >
        <tr>
            <th>id</th>
            <th>Name</th>
            <th>course</th>
            <th>Age</th>
        </tr>
        {% for i in data %}
        <tr>
            <th>{{i.id}}</th>
            <th>{{i.name}}</th>
            <th>{{i.course}}</th>
            <th>{{i.age}}</th>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
