<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XOX Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <p class="eyebrow">THE CLASSIC, REMIXED</p>
    <h1>XOX <span>Game</span></h1>
    <p class="subtitle">A little strategy. A lot of friendly rivalry.</p>

    <section class="scoreboard" aria-label="Score">
      <div class="score score-x"><span>PLAYER X</span><strong id="score-x">0</strong></div>
      <div class="score score-draw"><span>DRAWS</span><strong id="score-draws">0</strong></div>
      <div class="score score-o"><span>PLAYER O</span><strong id="score-o">0</strong></div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">
      <strong id="turn">X</strong><span id="status-text">starts first</span>
    </p>

    <div class="board" id="board" role="group" aria-label="Tic-tac-toe board">
      <button class="cell" type="button" data-cell="0" aria-label="Empty square 1"></button>
      <button class="cell" type="button" data-cell="1" aria-label="Empty square 2"></button>
      <button class="cell" type="button" data-cell="2" aria-label="Empty square 3"></button>
      <button class="cell" type="button" data-cell="3" aria-label="Empty square 4"></button>
      <button class="cell" type="button" data-cell="4" aria-label="Empty square 5"></button>
      <button class="cell" type="button" data-cell="5" aria-label="Empty square 6"></button>
      <button class="cell" type="button" data-cell="6" aria-label="Empty square 7"></button>
      <button class="cell" type="button" data-cell="7" aria-label="Empty square 8"></button>
      <button class="cell" type="button" data-cell="8" aria-label="Empty square 9"></button>
    </div>

    <div class="actions">
      <button class="new-round" id="new-round" type="button">New round</button>
      <button class="reset-score" id="reset-score" type="button">Reset score</button>
    </div>
    <p class="hint">Take turns. Get three in a row to win.</p>
  </main>
</body>
</html>
