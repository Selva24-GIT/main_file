<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/src/output.css">
</head>

<body>
    <script src="/script.js"></script>
    <div class=" relative w-full h-dvh bg-indigo-950 flex items-center justify-center ">
        <div
            class="border-2 w-fit h-fit px-28 py-10 bg-gradient-to-br from-30%  from-emerald-400  to-indigo-400 rounded-2xl ">
            <div>
                <input id="inputvalue" class="bg-white p-5 pr-32  rounded-4xl mb-10 " type="text"
                    placeholder="Enter the city Name ">
                <button id="btn" onclick="update()" class=" bg-white p-5 rounded-4xl ml-2 ">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6 flex items-center ">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                </button>
            </div>

            <div class="card  items-center  flex-col gap-12 flex hidden">


                <img class="weather_icon w-36 h-36 " alt="weather condition">

                <div>
                    <h1 class="temp font-medium text-6xl mb-3">22C</h1>
                    <h2 class="city text-4xl font-medium">content</h2>
                </div>

                <div class=" p-3 flex justify-between gap-16  ">
                    <div class="text-2xl font-normal flex gap-3 ">
                        <img class="w-16 h-16 " src="/Assets/humidity.png" alt="">
                        <h1 class="humidity font-bold"> info<br>
                            humidity
                        </h1>
                    </div>
                    <div class=" text-2xl font-normal flex gap-3">
                        <img class="w-20 h-20" src="/Assets/windy.png" alt="">
                        <h1 class="wind"> info <br>
                            wind speed
                        </h1>
                    </div>
                </div>

            </div>

            <div class="error flex items-center justify-center pb-10  text-5xl font-semibold hidden">not found</div>



        </div>

    </div>
    °
</body>

</html>
